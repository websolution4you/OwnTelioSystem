services:
  - type: web
    name: own-telio-system
    runtime: docker
    plan: starter
    healthCheckPath: /health/ready
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DRY_RUN
        value: "true"
      - key: BOOKING_WRITES_ENABLED
        value: "false"
      - key: TWILIO_VALIDATE_SIGNATURES
        value: "true"
      - key: STT_PROVIDER
        value: elevenlabs
      - key: LLM_PROVIDER
        value: openai
      - key: TTS_PROVIDER
        value: elevenlabs
      - key: TELIO_TIME_ZONE
        value: Europe/Bratislava
      - key: PUBLIC_BASE_URL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: TELIO_TENANT_ID
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: OPENAI_API_KEY
        sync: false
